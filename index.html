<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل التربية العملية | كلية التربية بتفهنا الأشراف</title>
    
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@^19.2.4/",
        "react": "https://esm.sh/react@^19.2.4",
        "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
        "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
        "vite": "https://esm.sh/vite@^7.3.1",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
      }
    }
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Cairo', sans-serif;
        background: linear-gradient(135deg, #f0f9ff 0%, #e2e8f0 100%);
        background-attachment: fixed;
        margin: 0;
        min-height: 100vh;
      }

      /* تحسين مظهر شريط التمرير */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.05);
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      @media print {
        body {
          background: white !important;
          margin: 0 !important;
          padding: 0 !important;
        }
        .no-print {
          display: none !important;
        }
        .no-print-backdrop {
          background: transparent !important;
          position: static !important;
          display: block !important;
          padding: 0 !important;
        }
        /* Ensure the modal content doesn't clip */
        .max-h-\[90vh\] {
          max-height: none !important;
          height: auto !important;
          overflow: visible !important;
        }
        .overflow-hidden {
          overflow: visible !important;
        }
        .overflow-y-auto {
          overflow: visible !important;
        }
        /* Target the letter container specifically */
        [data-print-container="true"] {
          box-shadow: none !important;
          margin: 0 !important;
          padding: 0 !important;
          width: 100% !important;
          min-height: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
